name: Probe public RSS access
on:
  workflow_dispatch:
    inputs:
      feed_urls:
        description: 'Up to five public HTTPS RSS URLs, separated by spaces (no credentials)'
        type: string
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node src/probe.mjs
        env:
          FEED_URLS: ${{ inputs.feed_urls }}
