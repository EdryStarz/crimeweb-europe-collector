name: Collect European news
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      source_prefix:
        description: 'Optional registered source ID prefix; empty collects all due European feeds'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: europe-news-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      feeds: ${{ steps.collect.outputs.feeds }}
      created: ${{ steps.collect.outputs.created }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Fetch, ingest and verify persisted jobs
        id: collect
        run: npm start
        env:
          INGESTION_API_URL: ${{ vars.INGESTION_API_URL }}
          EUROPE_COLLECTOR_SECRET: ${{ secrets.EUROPE_COLLECTOR_SECRET }}
          SOURCE_ID_PREFIX: ${{ inputs.source_prefix }}
  monthly-report:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Publish first successful collection report of the month
        run: node src/monthly-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FEEDS: ${{ needs.collect.outputs.feeds }}
          REPORT_CREATED: ${{ needs.collect.outputs.created }}
